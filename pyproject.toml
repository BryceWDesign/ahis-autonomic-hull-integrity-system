[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahis-autonomic-hull-integrity-system"
version = "4.0.0"
description = "Evaluation-licensed autonomic structural repair and survivability research testbed"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]
authors = [{name = "Bryce Lovell"}]

[project.scripts]
ahis = "ahis.survival.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "build>=1.2,<2"]
hardware = ["pyserial>=3.5,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ahis*", "analysis*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
