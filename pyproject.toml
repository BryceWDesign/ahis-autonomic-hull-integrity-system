[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahis-autonomic-hull-integrity-system"
version = "3.0.0"
description = "Evaluation-licensed autonomic structural repair and survivability research testbed"
requires-python = ">=3.11"
dependencies = []
authors = [{name = "Bryce Lovell"}]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
hardware = ["pyserial>=3.5,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ahis*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
